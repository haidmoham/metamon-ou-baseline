name: Lightweight checks (not battle validation)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m compileall -q src scripts tests
      - run: bash -n scripts/setup.sh scripts/start-server.sh
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
        # Heavyweight AMAGO adapter tests explicitly skip without dependencies.
        # Full local prep ran them; this CI does not claim GPU or battle coverage.
